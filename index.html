   Attempt to make repo name: /us/login?redirect=/us/courses/NUMBER/discussion/NUMBER&invalidlogintoken=1  -->
  
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a2a37;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            position: relative;
        }

        .login-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
            padding: 20px;
        }

        .logo {
            background-color: #6a44ff;
            color: #ffffff;
            font-weight: 700;
            font-size: 26px;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .alert-box {
            background-color: #531e2b;
            color: #DAAAB7;
            padding: 14px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
            width: 100%;
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
        }
      
        .form-groupR {
            width: 50%;
            height: 10%;
            font-size: 8px; 
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #9aa5b5;
        }

        select, input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        select {
            border: 1px solid #414d60;
            background-color: #2b3445;
            color: #ffffff;
            cursor: pointer;
        }

        input[type="email"] {
            border: 2px solid #ffffff;
            background-color: #ffffff;
            color: #ffffff;
        }

        .btn-continue {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #006dfa;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-continue:hover {
            background-color: #4d99fc;
        }

        .auth-links {
            margin-top: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-links a {
            color: #9aa5b5;
            text-decoration: none;
            font-size: 14px;
        }

        .auth-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .footer-links {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: #728096;
            text-decoration: none;
            font-size: 13px;
        }

        .footer-links a:hover {
            color: #cbd5e0;
        }

        .spacer-bottom {
            display: block;      /* Ensures the image behaves like a block element */
            margin-bottom: 20px; /* Adds 20px of empty space below the image */
        }
    </style>
</head>
<body>

    <div class="login-card">
      <img src="Ed Logo.svg" class="spacer-bottom" alt="Logo" width="80" height="80">
        
        <div class="alert-box">
            Your login token has expired or is invalid.<br>
            Log in again to continue.
        </div>
        
        <div class="form-groupR">
            <select class="start-region-select ed-focus-outline" title="Region" value="us">
              <option value="us">US</option>
              <option value="au">Australia</option>
              <option value="ca">Canada</option>
              <option value="eu">Europe</option>
              <option value="gb">United Kingdom</option>
            </select>
        </div>

        <div class="form-group">
            <label for="email"><b>Email</b></label>
            <input type="email" id="email" autocomplete="email" required>
        </div>

        <button class="btn-continue" type="button" onclick="window.location.href='info.html';">Continue</button>

        <div class="auth-links">
            <a href="#"><b>Login with an email code</b></a>
            <a href="#"><b>Forgot password?</b></a>
        </div>
    </div>

    <footer class="footer-links">
        <a href="#"><b>Privacy</b></a>
        <a href="#"><b>Terms</b></a>
    </footer>

</body>
</html>
